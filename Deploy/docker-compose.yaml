services:
  mysql:
    image: mysql:8.0.42
    container_name: pet_world_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Database/pet_world.sql:/docker-entrypoint-initdb.d/pet_world.sql
    networks:
      - pet_world_network

  redis:
    image: redis:7
    container_name: pet_world_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pet_world_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.8
    container_name: pet_world_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
    ports:
      - "9200:9200"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - pet_world_network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.18.8
    container_name: pet_world_kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - pet_world_network

  backend:
    build: ../Backend
    container_name: pet_world_backend
    env_file:
      - ../Backend/.env
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
      - elasticsearch
    restart: unless-stopped
    networks:
      - pet_world_network

  frontend:
    build: ../Frontend
    container_name: pet_world_frontend
    env_file:
      - ../Frontend/.env
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - pet_world_network

volumes:
  mysql_data:
  redis_data:
  es_data:

networks:
  pet_world_network:
    driver: bridge
