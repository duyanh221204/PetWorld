services:
  mysql:
    image: mysql:8.0.42
    container_name: pet_world_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pet_world
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3307:3307"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - pet_world_network

  redis:
    image: redis:7
    container_name: pet_world_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pet_world_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.8
    container_name: pet_world_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
    ports:
      - "9200:9200"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - pet_world_network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.1
    container_name: pet_world_kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - pet_world_network

volumes:
  mysql_data:
  redis_data:
  es_data:

networks:
  pet_world_network:
    driver: bridge